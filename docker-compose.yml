services:

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - flask-app

  flask-app:
    image: k1n9m0n73/flask-devops-app:latest

    env_file:
      - .env

    depends_on:
      - db

  db:
    image: postgres:16

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: