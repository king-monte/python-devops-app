services:
  flask-app:
    build: .
    container_name: flask-app

    ports:
      - "5000:5000"

    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flaskdb
      DB_HOST: db

    depends_on:
      - db

  db:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: password
      POSTGRES_DB: flaskdb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

