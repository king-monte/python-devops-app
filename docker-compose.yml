services:

  nginx:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - flask-app

    restart: unless-stopped

  flask-app:
    image: k1n9m0n73/flask-devops-app:latest

    env_file:
      - .env.prod

    depends_on:
      - db
    
    restart: unless-stopped

  db:
    image: postgres:16

    env_file:
      - .env.prod

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data: