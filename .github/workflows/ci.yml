name: Deploy Flask App

on:
  push:
    branches:
      - main

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Set Image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:${IMAGE_TAG} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:${IMAGE_TAG} ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:latest

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:${IMAGE_TAG}
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:latest
          
