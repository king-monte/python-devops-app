name: Deploy Flask App

on:
  push:
    branches:
      - main

jobs:

  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:${IMAGE_TAG} .

          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:${IMAGE_TAG} \
            ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:latest

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:${IMAGE_TAG}

          docker push ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 44

          script: |

            set -e

            cd ~/flask-app/python-devops-app

            echo "===== PULLING LATEST CODE ====="
            git pull origin main

            echo "===== DOCKER LOGIN ON VM ====="

            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}

            echo "===== TRACKING VERSIONS ====="

            PREVIOUS=$(cat current_version.txt 2>/dev/null || echo "none")

            echo "$PREVIOUS" > previous_version.txt
            echo "${IMAGE_TAG}" > current_version.txt

            echo "Previous Version: $PREVIOUS"
            echo "New Version: ${IMAGE_TAG}"

            echo "===== PULLING NEW IMAGES ====="

            docker compose pull

            echo "===== STARTING CONTAINERS ====="

            docker compose up -d

            echo "===== WAITING FOR APPLICATION ====="

            sleep 15

            echo "===== RUNNING HEALTH CHECK ====="

            if ! curl -f http://localhost/health; then

              echo "❌ HEALTH CHECK FAILED"

              if [ "$PREVIOUS" != "none" ]; then

                echo "🔄 STARTING ROLLBACK"

                docker compose down

                docker pull \
                  ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:$PREVIOUS

                docker tag \
                  ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:$PREVIOUS \
                  ${{ secrets.DOCKER_USERNAME }}/flask-devops-app:latest

                docker compose up -d

                echo "✅ ROLLBACK COMPLETE"

              else

                echo "⚠️ NO PREVIOUS VERSION AVAILABLE"

              fi

              exit 1

            fi

            echo "✅ DEPLOYMENT SUCCESSFUL"

            docker ps